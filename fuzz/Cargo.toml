[package]
name = "tap-ldk-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tap-ldk-core = { path = "../crates/tap-ldk-core" }

[patch."https://github.com/lightningdevkit/rust-lightning"]
lightning = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-types = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-invoice = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-net-tokio = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-persister = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-background-processor = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-rapid-gossip-sync = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-block-sync = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-transaction-sync = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-liquidity = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-macros = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }
lightning-dns-resolver = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "3db3229733b724f45e7a356d923715213cb4f269" }

[[bin]]
name = "tlv_decode"
path = "fuzz_targets/tlv_decode.rs"
test = false
doc = false

[[bin]]
name = "tapd_proof_file"
path = "fuzz_targets/tapd_proof_file.rs"
test = false
doc = false

[[bin]]
name = "virtual_psbt_summary"
path = "fuzz_targets/virtual_psbt_summary.rs"
test = false
doc = false

[[bin]]
name = "taproot_commitment_leaf"
path = "fuzz_targets/taproot_commitment_leaf.rs"
test = false
doc = false

[[bin]]
name = "lightning_labs_blobs"
path = "fuzz_targets/lightning_labs_blobs.rs"
test = false
doc = false
