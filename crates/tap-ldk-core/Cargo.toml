[package]
name = "tap-ldk-core"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "tap_ldk_core"
path = "src/lib.rs"

[dependencies]
bech32 = "0.9"
ldk-node = { git = "https://github.com/OpenAgentsInc/ldk-node.git", rev = "f803a5e3d0815bedf9250f22ff1045cea974135f" }
lightning = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "1e7b435a015dafb5cc314c135e2eebab18cf460f", package = "lightning", features = ["simple_taproot_musig2"] }
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true

[dev-dependencies]
