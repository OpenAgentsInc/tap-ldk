[package]
name = "tap-ldk-core"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "tap_ldk_core"
path = "src/lib.rs"

[dependencies]
bech32 = "0.9"
ldk-node = { git = "https://github.com/OpenAgentsInc/ldk-node.git", rev = "9f8481ef688dd2241f0575c341d9fce87bfc6c5c" }
lightning = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "99fee582d4061af4b0a030353b0a409ee542e064", package = "lightning", features = ["simple_taproot_musig2"] }
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true

[dev-dependencies]
