[workspace]
members = [
    "crates/tap-ldk-core",
    "crates/tap-ldk-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"
version = "0.1.0"

[workspace.metadata.tap-ldk.rust-lightning-fork]
url = "https://github.com/OpenAgentsInc/rust-lightning.git"
upstream = "https://github.com/lightningdevkit/rust-lightning.git"
base_rev = "0c37f08a55c0f7738f2691dc3690166fd42f851d"
rev = "cbc508b8ae972fd1134b0c5f1dc1792139276268"
strategy = "Direct git dependency for fork touchpoints now; patch crates once asset-channel fork code lands."

[workspace.metadata.tap-ldk.ldk-node-fork]
url = "https://github.com/OpenAgentsInc/ldk-node.git"
upstream = "https://github.com/lightningdevkit/ldk-node.git"
base_version = "0.7.0"
tracking_issues = [77, 78, 79, 80, 81]
strategy = "Fork ldk-node for the live demo runtime so it can use the OpenAgentsInc rust-lightning simple-taproot and Taproot Asset channel surfaces."

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
