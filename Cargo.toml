[workspace]
members = [
    "crates/tap-ldk-core",
    "crates/tap-ldk-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"
version = "0.1.0"

[workspace.metadata.tap-ldk.rust-lightning-fork]
url = "https://github.com/OpenAgentsInc/rust-lightning.git"
upstream = "https://github.com/lightningdevkit/rust-lightning.git"
base_rev = "0c37f08a55c0f7738f2691dc3690166fd42f851d"
rev = "4394c0e350dd5faf34ca37fc6bde5cc14497e3f9"
strategy = "Direct git dependency for fork touchpoints now; patch crates once asset-channel fork code lands."

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
