[workspace]
members = [
    "crates/tap-ldk-core",
    "crates/tap-ldk-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"
version = "0.1.0"

[workspace.metadata.tap-ldk.rust-lightning-fork]
url = "https://github.com/OpenAgentsInc/rust-lightning"
upstream = "https://github.com/lightningdevkit/rust-lightning"
base_rev = "0c37f08a55c0f7738f2691dc3690166fd42f851d"
rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e"
strategy = "Direct git dependency for fork touchpoints plus workspace patches so ldk-node and tap-ldk resolve the same OpenAgentsInc rust-lightning fork."

[workspace.metadata.tap-ldk.ldk-node-fork]
url = "https://github.com/OpenAgentsInc/ldk-node.git"
upstream = "https://github.com/lightningdevkit/ldk-node.git"
base_version = "0.7.0"
rev = "9fdb7cff9f47c5cc3b0003a68d9387c62e56147f"
tracking_issues = [77, 78, 79, 80, 81]
strategy = "Fork ldk-node for the live demo runtime so it can use the OpenAgentsInc rust-lightning simple-taproot and Taproot Asset channel surfaces."

[patch."https://github.com/lightningdevkit/rust-lightning"]
lightning = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-types = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-invoice = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-net-tokio = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-persister = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-background-processor = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-rapid-gossip-sync = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-block-sync = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-transaction-sync = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-liquidity = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-macros = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }
lightning-dns-resolver = { git = "https://github.com/OpenAgentsInc/rust-lightning", rev = "15710fb516e800b2d3cb4e5d9d3525a4e573b24e" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
